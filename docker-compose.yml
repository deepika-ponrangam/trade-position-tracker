services:
  mysql:
    image: mysql:8.0
    container_name: trade-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: trade_tracker
    ports:
      - "3306:3306"
    volumes:
      - trade_tracker_data:/var/lib/mysql
volumes:
  trade_tracker_data: